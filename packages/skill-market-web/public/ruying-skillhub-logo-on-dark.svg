  <text x="96" y="35" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24" font-weight="700">如影</text>
  <text x="96" y="64" fill="#83c7ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31" font-weight="750" letter-spacing="-0.8">SkillHub</text>
