server {
    listen 4211;
    server_name _;
    autoindex off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ (^|/)\. {
        return 404;
    }

    location ~* /(?:private|data|env)(?:/|$) {
        return 404;
    }

    # Replace the non-routable origin and bucket path before nginx -t. This
    # location exposes only the reviewed public prefix through the private IP.
    location /market-objects/ {
        proxy_pass http://oss-public-origin.invalid/bucket/ai-coding/ruying-code/skill-market-test/;
        proxy_set_header Host oss-public-origin.invalid;
        proxy_hide_header Set-Cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        limit_except GET HEAD { deny all; }
    }

    location /v1/ {
        client_max_body_size 55m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ai-coding/ruying-code/skill-market/assets/ {
        alias /srv/ruying-skill-market/web/current/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /ai-coding/ruying-code/skill-market/ {
        alias /srv/ruying-skill-market/web/current/;
        try_files $uri $uri/ /ai-coding/ruying-code/skill-market/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
